[project]
name = "campus-lost-found"
version = "0.1.0"
description = "Zero-shot vision-language retrieval system for campus lost and found item management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt 4.1 — pin below it.
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "open-clip-torch>=2.24",
    "faiss-cpu>=1.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The project is not installed as a package, so put the repo root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads the OpenCLIP or NLI checkpoint (deselect with -m 'not slow')"]
